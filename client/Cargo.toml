[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
ewebsock = "0.8.0"
shared = { path = "../shared" }
serde_json = "1.0.151"
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { workspace = true, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { workspace = true, features = ["webgl", "fira-sans"] }
