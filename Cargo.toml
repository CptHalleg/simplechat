[workspace]
members = [
    "client",
    "chat-server",
    "shared",
    "community-server",
    "profile-server",
    "server-shared",
    "macros",
]
resolver = "2"

[workspace.dependencies]
warp = "0.4"
serde = { version = "1.0.229" }
serde_json = "1.0.151"
iced = { version = "0.14.0" }
log = "0.4"
env_logger = "0.11"
tokio = "1.53.1"
sqlx = "0.9.0"
dotenvy = "0.15.7"
axum = "0.8.9"
